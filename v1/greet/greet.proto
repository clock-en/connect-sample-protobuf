syntax = "proto3";

package greet;

option go_package = "github.com/clock-en/connect-sample-backend/pbgen/submodules/protobuf/v1/greet;v1greet";

message GreetRequest {
  string name = 1;
}

message GreetResponse {
  string greeting = 1;
}

service GreetService {
  rpc Greet(GreetRequest) returns (GreetResponse) {}
}
